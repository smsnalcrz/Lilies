      /* =====================================================================
       * 2. COLOR UTILITIES
       * ===================================================================== */
      function hexToRgb(hex) {
        const clean = hex.replace("#", "").trim();
        const full = clean.length === 3
          ? clean.split("").map((c) => c + c).join("")
          : clean;
        const n = parseInt(full, 16);
        return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
      }

      function rgbToHex(r, g, b) {
        const toHex = (v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
        return `#${toHex(r)}${toHex(g)}${toHex(b)}`;
      }

      function hslToHex(h, s, l) {
        const sn = s / 100;
        const ln = l / 100;
        const k = (n) => (n + h / 30) % 12;
        const a = sn * Math.min(ln, 1 - ln);
        const f = (n) => ln - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
        return rgbToHex(f(0) * 255, f(8) * 255, f(4) * 255);
      }

      /* =====================================================================
       * 3. 3D PARAMETRIC LILY BOUQUET GEOMETRY BUILDER
       *    Builds 7 full 6-petaled recurved lilies, 2 lily buds, curved stems,
       *    lanceolate leaves, and a hand-tied ribbon wrap + bow in true 3D.
       * ===================================================================== */
      const PART = {
        PETAL: 0,
        THROAT: 1,
        SPECKLE: 2,
        STAMEN: 3,
        ANTHER: 4,
        PISTIL: 5,
        STEM: 6,
        LEAF: 7,
        RIBBON: 8,
      };

      // Orthonormal local-to-world frame helper where `up` is the bloom axis
      function buildBasis(dir, roll = 0) {
        const len = Math.hypot(dir[0], dir[1], dir[2]) || 1;
        const up = [dir[0] / len, dir[1] / len, dir[2] / len];
        const ref = Math.abs(up[1]) > 0.92 ? [0, 0, 1] : [0, 1, 0];

        // right0 = normalize(ref x up)
        let rx = ref[1] * up[2] - ref[2] * up[1];
        let ry = ref[2] * up[0] - ref[0] * up[2];
        let rz = ref[0] * up[1] - ref[1] * up[0];
        const rLen = Math.hypot(rx, ry, rz) || 1;
        rx /= rLen; ry /= rLen; rz /= rLen;

        // fwd0 = up x right0
        const fx = up[1] * rz - up[2] * ry;
        const fy = up[2] * rx - up[0] * rz;
        const fz = up[0] * ry - up[1] * rx;

        const cr = Math.cos(roll);
        const sr = Math.sin(roll);

        return {
          right: [rx * cr + fx * sr, ry * cr + fy * sr, rz * cr + fz * sr],
          up,
          fwd: [-rx * sr + fx * cr, -ry * sr + fy * cr, -rz * sr + fz * cr],
        };
      }

      function localToWorld(origin, basis, lx, ly, lz) {
        return [
          origin[0] + basis.right[0] * lx + basis.up[0] * ly + basis.fwd[0] * lz,
          origin[1] + basis.right[1] * lx + basis.up[1] * ly + basis.fwd[1] * lz,
          origin[2] + basis.right[2] * lx + basis.up[2] * ly + basis.fwd[2] * lz,
        ];
      }

      function localNormalToWorld(basis, nx, ny, nz) {
        const wx = basis.right[0] * nx + basis.up[0] * ny + basis.fwd[0] * nz;
        const wy = basis.right[1] * nx + basis.up[1] * ny + basis.fwd[1] * nz;
        const wz = basis.right[2] * nx + basis.up[2] * ny + basis.fwd[2] * nz;
        const l = Math.hypot(wx, wy, wz) || 1;
        return [wx / l, wy / l, wz / l];
      }

      function buildBouquetGeometry() {
        const points = [];

        function pushPoint(pos, normal, part, flowerIdx, shadeBias = 0, edgeWeight = 0) {
          points.push({
            x: pos[0],
            y: pos[1],
            z: pos[2],
            nx: normal[0],
            ny: normal[1],
            nz: normal[2],
            part,
            flowerIdx,
            shadeBias,
            edgeWeight,
          });
        }

        // Parametric surface for a single recurved lily petal in local flower space
        function evalPetal(u, v, theta, scale, isInner, openFactor = 1.0) {
          // Trumpet flare and graceful recurve at the tip
          const rBase = 0.055;
          const rFlare = (0.94 * u + 0.16 * u * u - 0.15 * u * u * u) * openFactor;
          const r = scale * (rBase + rFlare * (isInner ? 0.96 : 1.05));

          // Vertical cup height arching upward, then curling gently back near u = 1
          const hArch = (1.42 * u - 1.06 * u * u + 0.04 * u * u * u) * (0.76 + 0.24 * openFactor);
          const h = scale * hArch * (isInner ? 1.05 : 0.93);

          // Lanceolate lily petal width: narrow throat, lush belly, pointed tip
          const widthProfile = Math.sin(Math.PI * Math.pow(u, 0.72)) * (1 - 0.12 * u);
          const maxHalfW = scale * (isInner ? 0.34 : 0.30) * (0.55 + 0.45 * openFactor);
          const w = v * maxHalfW * widthProfile;

          // Subtle transverse cup + central midrib crease for realistic 3D light catching
          const cupLift = scale * (0.075 * (1 - v * v) - 0.03 * Math.abs(v)) * Math.sin(Math.PI * u);

          const ct = Math.cos(theta);
          const st = Math.sin(theta);

          // Radial direction (ct, 0, st), tangent direction (-st, 0, ct)
          const lx = r * ct - w * st;
          const ly = h + cupLift;
          const lz = r * st + w * ct;
          return [lx, ly, lz];
        }

        function addLilyBloom(cfg) {
          const basis = buildBasis(cfg.dir, cfg.roll);
          const S = cfg.scale;
          const openFactor = cfg.openFactor ?? 1.0;

          // 6 tepals: 3 outer sepals + 3 inner petals alternating every 60 degrees
          const uSteps = 17;
          const vSteps = 11;
          const eps = 0.015;

          for (let p = 0; p < 6; p++) {
            const isInner = p % 2 === 1;
            const theta = (p * Math.PI) / 3;

            for (let iu = 0; iu <= uSteps; iu++) {
              const u = iu / uSteps;
              // Fewer width samples near very narrow base and pointed tip
              const localVSteps = u < 0.08 || u > 0.94 ? 3 : vSteps;

              for (let iv = 0; iv <= localVSteps; iv++) {
                const v = (iv / localVSteps) * 2 - 1;
                const pt = evalPetal(u, v, theta, S, isInner, openFactor);

                // Compute smooth analytical-like surface normal via finite differences
                const pu = evalPetal(Math.min(1, u + eps), v, theta, S, isInner, openFactor);
                const pv = evalPetal(u, Math.min(1, v + eps), theta, S, isInner, openFactor);
                const du = [pu[0] - pt[0], pu[1] - pt[1], pu[2] - pt[2]];
                const dv = [pv[0] - pt[0], pv[1] - pt[1], pv[2] - pt[2]];

                // Cross product du x dv
                let nx = du[1] * dv[2] - du[2] * dv[1];
                let ny = du[2] * dv[0] - du[0] * dv[2];
                let nz = du[0] * dv[1] - du[1] * dv[0];
                const nl = Math.hypot(nx, ny, nz) || 1;
                nx /= nl; ny /= nl; nz /= nl;

                // Orient normal consistently toward inner/upper face of the lily cup
                if (ny < 0) {
                  nx = -nx; ny = -ny; nz = -nz;
                }

                const wPos = localToWorld(cfg.pos, basis, pt[0], pt[1], pt[2]);
                const wNorm = localNormalToWorld(basis, nx, ny, nz);

                // Classify throat glow, inner lily speckles, and petal surface
                let part = PART.PETAL;
                if (u < 0.20) {
                  part = PART.THROAT;
                } else if (
                  u > 0.22 && u < 0.56 &&
                  Math.abs(v) < 0.52 &&
                  ((iu * 7 + iv * 13 + p * 5) % 11 === 0)
                ) {
                  part = PART.SPECKLE;
                }

                const edgeWeight = Math.max(Math.abs(v), u > 0.88 ? (u - 0.88) / 0.12 : 0);
                // Slight gradient brightening toward tips & midrib
                const shadeBias = (u * 0.16) + (1 - Math.abs(v)) * 0.08 - (isInner ? 0 : 0.04);

                pushPoint(wPos, wNorm, part, cfg.flowerIdx, shadeBias, edgeWeight);
              }
            }
          }

          // Central Pistil (style + 3-lobed stigma)
          const pistilSteps = 10;
          for (let i = 0; i <= pistilSteps; i++) {
            const t = i / pistilSteps;
            const lx = S * 0.04 * Math.sin(t * Math.PI * 0.6);
            const ly = S * (0.05 + 0.68 * t);
            const lz = S * 0.02 * t;
            const wPos = localToWorld(cfg.pos, basis, lx, ly, lz);
            const wNorm = localNormalToWorld(basis, 0.2, 0.9, 0.2);
            pushPoint(wPos, wNorm, PART.PISTIL, cfg.flowerIdx, t * 0.2, 0);
          }

          // 6 Graceful Curved Stamens + Golden Pollen Anthers
          for (let s = 0; s < 6; s++) {
            const angle = (s * Math.PI) / 3 + Math.PI / 6;
            const ca = Math.cos(angle);
            const sa = Math.sin(angle);

            const filSteps = 9;
            let tipLocal = [0, 0, 0];
            for (let i = 1; i <= filSteps; i++) {
              const t = i / filSteps;
              const r = S * (0.03 + 0.27 * Math.pow(t, 1.35));
              const y = S * (0.04 + 0.58 * t - 0.06 * t * t);
              const lx = r * ca;
              const ly = y;
              const lz = r * sa;
              tipLocal = [lx, ly, lz];

              const wPos = localToWorld(cfg.pos, basis, lx, ly, lz);
              const wNorm = localNormalToWorld(basis, ca * 0.6, 0.75, sa * 0.6);
              pushPoint(wPos, wNorm, PART.STAMEN, cfg.flowerIdx, t * 0.15, 0);
            }

            // Elongated oval pollen anther perched transversely at each stamen tip
            for (let a = -2; a <= 2; a++) {
              const offset = a * 0.026 * S;
              const ax = tipLocal[0] - sa * offset;
              const ay = tipLocal[1] + (1 - Math.abs(a) * 0.16) * 0.022 * S;
              const az = tipLocal[2] + ca * offset;
              const wPos = localToWorld(cfg.pos, basis, ax, ay, az);
              const wNorm = localNormalToWorld(basis, ca * 0.5, 0.85, sa * 0.5);
              pushPoint(wPos, wNorm, PART.ANTHER, cfg.flowerIdx, 0.22 - Math.abs(a) * 0.05, 0);
            }
          }
        }

        // Half-closed slender lily bud for natural florist texture
        function addLilyBud(cfg) {
          const basis = buildBasis(cfg.dir, cfg.roll);
          const S = cfg.scale;
          for (let p = 0; p < 4; p++) {
            const theta = (p * Math.PI) / 2;
            for (let iu = 0; iu <= 11; iu++) {
              const u = iu / 11;
              const r = S * (0.05 + 0.24 * Math.sin(Math.PI * Math.pow(u, 0.8)));
              const y = S * (1.15 * u);
              for (let iv = -2; iv <= 2; iv++) {
                const a = theta + iv * 0.26;
                const lx = r * Math.cos(a);
                const lz = r * Math.sin(a);
                const wPos = localToWorld(cfg.pos, basis, lx, y, lz);
                const wNorm = localNormalToWorld(basis, Math.cos(a), 0.35, Math.sin(a));
                pushPoint(wPos, wNorm, u < 0.24 ? PART.THROAT : PART.PETAL, cfg.flowerIdx, u * 0.12, Math.abs(iv) / 2);
              }
            }
          }
        }

        // Cubic Bezier curved stem from bloom base -> gathered bouquet waist -> cut bottom
        function addStem(startPos, waistPos, endPos, radius = 0.036) {
          const ctrl1 = [
            startPos[0] * 0.72 + waistPos[0] * 0.28,
            startPos[1] * 0.48 + waistPos[1] * 0.52,
            startPos[2] * 0.72 + waistPos[2] * 0.28,
          ];
          const ctrl2 = [
            waistPos[0] * 0.85 + endPos[0] * 0.15,
            waistPos[1] * 0.72 + endPos[1] * 0.28,
            waistPos[2] * 0.85 + endPos[2] * 0.15,
          ];

          const steps = 46;
          for (let i = 0; i <= steps; i++) {
            const t = i / steps;
            const mt = 1 - t;
            const mt2 = mt * mt;
            const t2 = t * t;

            const x = mt2 * mt * startPos[0] + 3 * mt2 * t * ctrl1[0] + 3 * mt * t2 * ctrl2[0] + t2 * t * endPos[0];
            const y = mt2 * mt * startPos[1] + 3 * mt2 * t * ctrl1[1] + 3 * mt * t2 * ctrl2[1] + t2 * t * endPos[1];
            const z = mt2 * mt * startPos[2] + 3 * mt2 * t * ctrl1[2] + 3 * mt * t2 * ctrl2[2] + t2 * t * endPos[2];

            // 4 points around stem circumference so stems never look papery or disappear
            for (let c = 0; c < 4; c++) {
              const ang = (c * Math.PI) / 2 + i * 0.2;
              const nx = Math.cos(ang);
              const nz = Math.sin(ang);
              const nl = Math.hypot(nx, 0.15, nz) || 1;
              pushPoint(
                [x + nx * radius, y, z + nz * radius],
                [nx / nl, 0.15 / nl, nz / nl],
                PART.STEM,
                -1,
                -0.06 + (1 - t) * 0.1,
                0
              );
            }
          }
        }

        // Slender arching lanceolate lily leaf
        function addLeaf(basePos, angleY, lift, length, width) {
          const ca = Math.cos(angleY);
          const sa = Math.sin(angleY);
          const uSteps = 14;
          const vSteps = 5;

          for (let iu = 0; iu <= uSteps; iu++) {
            const u = iu / uSteps;
            const r = length * (0.95 * u);
            const h = length * (lift * u - 0.56 * u * u);
            const halfW = width * Math.sin(Math.PI * Math.pow(u, 0.76));

            for (let iv = 0; iv <= vSteps; iv++) {
              const v = (iv / vSteps) * 2 - 1;
              const w = v * halfW;
              const fold = 0.035 * Math.abs(v) * Math.sin(Math.PI * u);

              const x = basePos[0] + r * ca - w * sa;
              const y = basePos[1] + h + fold;
              const z = basePos[2] + r * sa + w * ca;

              const nx = ca * 0.25 - sa * v * 0.25;
              const ny = 0.88;
              const nz = sa * 0.25 + ca * v * 0.25;
              const nl = Math.hypot(nx, ny, nz) || 1;

              pushPoint(
                [x, y, z],
                [nx / nl, ny / nl, nz / nl],
                PART.LEAF,
                -1,
                u * 0.16 - Math.abs(v) * 0.08,
                Math.abs(v)
              );
            }
          }
        }

        // Hand-tied satin ribbon wrap, double bow loops, and two flowing ribbon tails
        function addRibbonWrap() {
          const waistY = -1.08;

          // Band collar hugging the gathered stems
          for (let band = 0; band < 7; band++) {
            const y = waistY - 0.16 + band * 0.052;
            const rad = 0.31 + Math.abs(band - 3) * 0.014;
            const segs = 34;
            for (let i = 0; i < segs; i++) {
              const a = (i / segs) * Math.PI * 2;
              const ca = Math.cos(a);
              const sa = Math.sin(a);
              const nl = Math.hypot(ca, 0.12, sa) || 1;
              pushPoint(
                [rad * ca, y, rad * sa],
                [ca / nl, 0.12 / nl, sa / nl],
                PART.RIBBON,
                -1,
                0.08 - Math.abs(band - 3) * 0.03,
                0
              );
            }
          }

          // Front bow knot + two soft sculpted loops on +Z side
          for (const side of [-1, 1]) {
            const snl = Math.hypot(side * 0.35, 0.35, 0.86) || 1;
            for (let i = 0; i <= 22; i++) {
              const t = (i / 22) * Math.PI;
              const loopX = side * (0.08 + 0.42 * Math.sin(t));
              const loopY = waistY + 0.18 * Math.sin(2 * t) * 0.55 + 0.04;
              const loopZ = 0.34 + 0.22 * Math.sin(t);
              for (let w = -1; w <= 1; w++) {
                pushPoint(
                  [loopX, loopY + w * 0.032, loopZ],
                  [(side * 0.35) / snl, 0.35 / snl, 0.86 / snl],
                  PART.RIBBON,
                  -1,
                  0.14,
                  Math.abs(w)
                );
              }
            }
          }

          // Two gently curving ribbon tails trailing downward
          for (const side of [-1, 1]) {
            const tnl = Math.hypot(side * 0.25, 0.1, 0.96) || 1;
            for (let i = 0; i <= 24; i++) {
              const t = i / 24;
              const tx = side * (0.10 + 0.36 * t + 0.08 * Math.sin(t * Math.PI * 1.6));
              const ty = waistY - 0.05 - 0.96 * t;
              const tz = 0.34 + 0.14 * Math.sin(t * Math.PI) + 0.05 * t;
              for (let w = -1; w <= 1; w++) {
                pushPoint(
                  [tx + w * 0.028, ty, tz],
                  [(side * 0.25) / tnl, 0.1 / tnl, 0.96 / tnl],
                  PART.RIBBON,
                  -1,
                  0.06 - t * 0.12,
                  Math.abs(w)
                );
              }
            }
          }
        }

        // Bouquet arrangement: 7 full lilies positioned harmoniously in 3D
        const lilies = [
          { flowerIdx: 0, pos: [ 0.00, 1.48,  0.04], dir: [ 0.04, 0.96,  0.24], scale: 0.96, roll: 0.15 },
          { flowerIdx: 1, pos: [-0.96, 0.74,  0.76], dir: [-0.52, 0.56,  0.64], scale: 0.90, roll: 0.55 },
          { flowerIdx: 2, pos: [ 0.94, 0.88,  0.74], dir: [ 0.50, 0.60,  0.62], scale: 0.89, roll: 1.05 },
          { flowerIdx: 3, pos: [-1.24, 1.02, -0.34], dir: [-0.76, 0.58, -0.28], scale: 0.86, roll: 0.35 },
          { flowerIdx: 4, pos: [ 1.24, 0.68, -0.44], dir: [ 0.76, 0.52, -0.38], scale: 0.85, roll: 0.80 },
          { flowerIdx: 5, pos: [-0.58, 1.14, -1.06], dir: [-0.36, 0.62, -0.70], scale: 0.88, roll: 0.25 },
          { flowerIdx: 6, pos: [ 0.60, 1.04, -1.02], dir: [ 0.40, 0.58, -0.71], scale: 0.86, roll: 0.95 },
        ];

        for (const lily of lilies) {
          addLilyBloom(lily);
          const waist = [lily.pos[0] * 0.14, -1.08, lily.pos[2] * 0.14];
          const bottom = [-lily.pos[0] * 0.22, -2.26, -lily.pos[2] * 0.22];
          addStem(lily.pos, waist, bottom, 0.036);
        }

        // 2 delicate accent buds sharing colors from lilies 1 and 4
        const buds = [
          { flowerIdx: 1, pos: [-0.38, 1.26,  0.84], dir: [-0.26, 0.86,  0.44], scale: 0.52, roll: 0.4 },
          { flowerIdx: 4, pos: [ 0.44, 1.32, -0.58], dir: [ 0.30, 0.86, -0.40], scale: 0.50, roll: 1.1 },
        ];

        for (const bud of buds) {
          addLilyBud(bud);
          const waist = [bud.pos[0] * 0.14, -1.08, bud.pos[2] * 0.14];
          const bottom = [-bud.pos[0] * 0.18, -2.18, -bud.pos[2] * 0.18];
          addStem(bud.pos, waist, bottom, 0.028);
        }

        // 14 graceful lanceolate leaves arranged around the stems
        const leafCount = 14;
        for (let i = 0; i < leafCount; i++) {
          const angle = (i / leafCount) * Math.PI * 2 + (i % 2) * 0.18;
          const tier = i % 2;
          const yBase = tier === 0 ? -0.58 : -0.18;
          const radOffset = tier === 0 ? 0.24 : 0.34;
          const basePos = [Math.cos(angle) * radOffset, yBase, Math.sin(angle) * radOffset];
          const lift = tier === 0 ? 0.52 : 0.68;
          const len = tier === 0 ? 1.12 : 0.94;
          const width = tier === 0 ? 0.19 : 0.16;
          addLeaf(basePos, angle, lift, len, width);
        }

        addRibbonWrap();

        // Pack into flat typed arrays for fast, zero-GC 60fps animation
        const count = points.length;
        const geom = {
          count,
          x: new Float32Array(count),
          y: new Float32Array(count),
          z: new Float32Array(count),
          nx: new Float32Array(count),
          ny: new Float32Array(count),
          nz: new Float32Array(count),
          part: new Uint8Array(count),
          flowerIdx: new Int8Array(count),
          shadeBias: new Float32Array(count),
          edgeWeight: new Float32Array(count),
        };

        for (let i = 0; i < count; i++) {
          const p = points[i];
          geom.x[i] = p.x;
          geom.y[i] = p.y;
          geom.z[i] = p.z;
          geom.nx[i] = p.nx;
          geom.ny[i] = p.ny;
          geom.nz[i] = p.nz;
          geom.part[i] = p.part;
          geom.flowerIdx[i] = p.flowerIdx;
          geom.shadeBias[i] = p.shadeBias;
          geom.edgeWeight[i] = p.edgeWeight;
        }

        return geom;
      }

      /* =====================================================================
       * 4. 3D Z-BUFFERED ASCII RENDERER
       * ===================================================================== */
      const PETAL_RAMP = ".,:-~=+*#%@";
      const EDGE_RAMP = ".,:~-^/\\*";
      const LEAF_RAMP = ".,:;-~=/\\";
      const STEM_RAMP = ":;|!|";
      const RIBBON_RAMP = ".,:~=%#";
      const ANTHER_RAMP = "oO#@";

      const bouquetCanvas = document.getElementById("bouquetCanvas");
      const bCtx = bouquetCanvas.getContext("2d", { alpha: true });
      const stageFrame = document.getElementById("stageFrame");
      const stageHint = document.getElementById("stageHint");

      const geometry = buildBouquetGeometry();

      // Current & target RGB colors for smooth watercolor-like color transitions
      const activeFlowersRgb = COLOR_PALETTES[0].flowers.map(hexToRgb);
      const targetFlowersRgb = COLOR_PALETTES[0].flowers.map(hexToRgb);
      const activeRibbonRgb = hexToRgb(COLOR_PALETTES[0].ribbon);
      const targetRibbonRgb = hexToRgb(COLOR_PALETTES[0].ribbon);

      let currentPaletteId = COLOR_PALETTES[0].id;
      let currentPaletteIdx = 0;

      // Grid & viewport state
      let canvasW = 640;
      let canvasH = 440;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let cellW = 7;
      let cellH = 12;
      let fontSize = 11;
      let cols = 90;
      let rows = 36;

      // Pre-allocated screen-space ASCII z-buffer arrays
      let zBuf = new Float32Array(1);
      let charBuf = new Array(1);
      let rBuf = new Uint8Array(1);
      let gBuf = new Uint8Array(1);
      let bBuf = new Uint8Array(1);
      let aBuf = new Float32Array(1);

      function configureGrid() {
        const rect = stageFrame.getBoundingClientRect();
        canvasW = Math.max(260, Math.round(rect.width));
        canvasH = Math.max(280, Math.round(rect.height));
        dpr = Math.min(window.devicePixelRatio || 1, 2);

        bouquetCanvas.width = Math.round(canvasW * dpr);
        bouquetCanvas.height = Math.round(canvasH * dpr);
        bCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Adaptive crisp monospace font size so ASCII stays detailed and legible on every screen
        const shortSide = Math.min(canvasW, canvasH);
        fontSize = Math.max(8.5, Math.min(11.5, shortSide / 46));

        bCtx.font = `600 ${fontSize}px "Cascadia Code", "Fira Code", "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace`;
        bCtx.textAlign = "center";
        bCtx.textBaseline = "middle";

        const measured = bCtx.measureText("M").width;
        cellW = Math.max(5.2, measured * 1.02);
        cellH = Math.max(8.5, fontSize * 1.08);

        cols = Math.max(36, Math.floor(canvasW / cellW));
        rows = Math.max(24, Math.floor(canvasH / cellH));

        const total = cols * rows;
        zBuf = new Float32Array(total);
        charBuf = new Array(total);
        rBuf = new Uint8Array(total);
        gBuf = new Uint8Array(total);
        bBuf = new Uint8Array(total);
        aBuf = new Float32Array(total);
      }

      // Animation & interaction state
      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let isPaused = prefersReducedMotion;
      let rotY = 0.25;
      let basePitch = 0.20;
      let userPitchOffset = 0;
      let targetPitchOffset = 0;
      let rotVelocity = 0;
      let elapsedTime = 0;

      // Pointer drag to gently inspect the bouquet from any angle
      let isDragging = false;
      let lastPointerX = 0;
      let lastPointerY = 0;
      let hintDismissed = false;

      stageFrame.addEventListener("pointerdown", (e) => {
        if (e.target.closest("button")) return;
        isDragging = true;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;
        stageFrame.setPointerCapture(e.pointerId);
        if (!hintDismissed) {
          hintDismissed = true;
          stageHint.style.opacity = "0";
        }
      });

      stageFrame.addEventListener("pointermove", (e) => {
        if (!isDragging) return;
        const dx = e.clientX - lastPointerX;
        const dy = e.clientY - lastPointerY;
        lastPointerX = e.clientX;
        lastPointerY = e.clientY;

        rotY += dx * 0.0095;
        rotVelocity = dx * 0.0028;
        targetPitchOffset = Math.max(-0.34, Math.min(0.42, targetPitchOffset + dy * 0.005));
      });

      function endDrag() {
        isDragging = false;
      }

      stageFrame.addEventListener("pointerup", endDrag);
      stageFrame.addEventListener("pointercancel", endDrag);

      // Normalized key light (upper front-left) and gentle cool rim light
      const lightKey = (() => {
        const x = -0.45, y = 0.72, z = 0.65;
        const l = Math.hypot(x, y, z);
        return [x / l, y / l, z / l];
      })();

      function renderBouquet(dt) {
        // Smoothly interpolate all flower colors and ribbon tint without interrupting rotation
        const colorEase = Math.min(1, dt * 5.2);
        for (let i = 0; i < 7; i++) {
          for (let c = 0; c < 3; c++) {
            activeFlowersRgb[i][c] += (targetFlowersRgb[i][c] - activeFlowersRgb[i][c]) * colorEase;
          }
        }
        for (let c = 0; c < 3; c++) {
          activeRibbonRgb[c] += (targetRibbonRgb[c] - activeRibbonRgb[c]) * colorEase;
        }

        // Update graceful rotation and gentle breathing sway
        if (!isDragging) {
          if (!isPaused) {
            elapsedTime += dt;
            rotY += dt * 0.34; // Slow, serene rotation (~18.5s per full turn)
          }
          rotY += rotVelocity;
          rotVelocity *= Math.pow(0.06, dt);
          targetPitchOffset *= Math.pow(0.45, dt);
        }
        userPitchOffset += (targetPitchOffset - userPitchOffset) * Math.min(1, dt * 6);

        const breathPitch = isPaused ? 0 : Math.sin(elapsedTime * 0.65) * 0.045;
        const pitch = basePitch + userPitchOffset + breathPitch;

        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const cosP = Math.cos(pitch);
        const sinP = Math.sin(pitch);

        // Clear screen-space z-buffer
        const totalCells = cols * rows;
        zBuf.fill(-1e9);

        const cx = canvasW * 0.5;
        const cy = canvasH * 0.515;
        const fitSize = Math.min(canvasW, canvasH * 0.96);
        const camZ = 8.7;
        const focalPx = fitSize * 1.29;

        // Project every 3D point onto the ASCII grid
        const nPts = geometry.count;
        const gxArr = geometry.x;
        const gyArr = geometry.y;
        const gzArr = geometry.z;
        const nxArr = geometry.nx;
        const nyArr = geometry.ny;
        const nzArr = geometry.nz;
        const partArr = geometry.part;
        const fIdxArr = geometry.flowerIdx;
        const biasArr = geometry.shadeBias;
        const edgeArr = geometry.edgeWeight;

        for (let i = 0; i < nPts; i++) {
          // 1. Rotate around vertical Y axis
          const x0 = gxArr[i];
          const y0 = gyArr[i];
          const z0 = gzArr[i];

          const xr = x0 * cosY + z0 * sinY;
          const zr = -x0 * sinY + z0 * cosY;

          // 2. Apply gentle viewing pitch around X axis
          const yp = y0 * cosP - zr * sinP;
          const zp = y0 * sinP + zr * cosP;

          const dist = camZ - zp;
          if (dist <= 0.6) continue;

          const invDist = 1 / dist;
          const persp = focalPx * invDist;

          const px = cx + xr * persp;
          const py = cy - yp * persp;

          const col = (px / cellW) | 0;
          const row = (py / cellH) | 0;
          if (col < 0 || col >= cols || row < 0 || row >= rows) continue;

          const cellIdx = row * cols + col;
          if (zp <= zBuf[cellIdx]) continue;
          zBuf[cellIdx] = zp;

          // 3. Rotate surface normal to match world orientation
          const nx0 = nxArr[i];
          const ny0 = nyArr[i];
          const nz0 = nzArr[i];

          const nxr = nx0 * cosY + nz0 * sinY;
          const nzr = -nx0 * sinY + nz0 * cosY;
          const nyp = ny0 * cosP - nzr * sinP;
          const nzp = ny0 * sinP + nzr * cosP;

          // 4. Two-sided botanical translucent lighting + rim highlight + depth cueing
          const ndotl = nxr * lightKey[0] + nyp * lightKey[1] + nzp * lightKey[2];
          const diffuse = ndotl >= 0 ? ndotl * 0.72 : -ndotl * 0.44;
          const rim = Math.pow(Math.max(0, 1 - Math.abs(nzp)), 2.2) * 0.24;
          const depthFactor = Math.max(0.54, Math.min(1.16, 0.86 + zp * 0.145));

          let lum = (0.30 + diffuse + rim + biasArr[i]) * depthFactor;
          if (isNaN(lum)) lum = 0.5;
          lum = Math.max(0.08, Math.min(1.0, lum));

          const part = partArr[i];
          let baseR = 240, baseG = 200, baseB = 215;
          let ch = "*";

          if (part === PART.PETAL) {
            const colRgb = activeFlowersRgb[fIdxArr[i]] || activeFlowersRgb[0];
            baseR = colRgb[0];
            baseG = colRgb[1];
            baseB = colRgb[2];
            const ramp = edgeArr[i] > 0.84 ? EDGE_RAMP : PETAL_RAMP;
            ch = ramp[Math.max(0, Math.min(ramp.length - 1, Math.floor(lum * ramp.length)))];
          } else if (part === PART.THROAT) {
            // Soft warm ivory-green inner lily throat blended with petal hue
            const colRgb = activeFlowersRgb[fIdxArr[i]] || activeFlowersRgb[0];
            baseR = colRgb[0] * 0.52 + 236 * 0.48;
            baseG = colRgb[1] * 0.52 + 244 * 0.48;
            baseB = colRgb[2] * 0.52 + 196 * 0.48;
            ch = PETAL_RAMP[Math.max(0, Math.min(PETAL_RAMP.length - 1, Math.floor(lum * PETAL_RAMP.length)))];
          } else if (part === PART.SPECKLE) {
            // Subtle deeper Stargazer-style inner petal speckles
            const colRgb = activeFlowersRgb[fIdxArr[i]] || activeFlowersRgb[0];
            baseR = colRgb[0] * 0.55 + 65;
            baseG = colRgb[1] * 0.38 + 20;
            baseB = colRgb[2] * 0.48 + 38;
            ch = lum > 0.62 ? ":" : ".";
          } else if (part === PART.ANTHER) {
            // Warm golden-amber pollen anthers
            baseR = 248;
            baseG = 192;
            baseB = 82;
            ch = ANTHER_RAMP[Math.max(0, Math.min(ANTHER_RAMP.length - 1, Math.floor(lum * ANTHER_RAMP.length)))];
          } else if (part === PART.STAMEN) {
            baseR = 238;
            baseG = 232;
            baseB = 196;
            ch = xr * 0.4 > 0.16 ? "/" : xr * 0.4 < -0.16 ? "\\" : ":";
          } else if (part === PART.PISTIL) {
            baseR = 202;
            baseG = 235;
            baseB = 178;
            ch = lum > 0.7 ? "Y" : "|";
          } else if (part === PART.STEM) {
            baseR = 112;
            baseG = 176;
            baseB = 122;
            ch = STEM_RAMP[Math.max(0, Math.min(STEM_RAMP.length - 1, Math.floor(lum * STEM_RAMP.length)))];
          } else if (part === PART.LEAF) {
            baseR = 122;
            baseG = 192;
            baseB = 134;
            ch = LEAF_RAMP[Math.max(0, Math.min(LEAF_RAMP.length - 1, Math.floor(lum * LEAF_RAMP.length)))];
          } else if (part === PART.RIBBON) {
            baseR = activeRibbonRgb[0];
            baseG = activeRibbonRgb[1];
            baseB = activeRibbonRgb[2];
            ch = RIBBON_RAMP[Math.max(0, Math.min(RIBBON_RAMP.length - 1, Math.floor(lum * RIBBON_RAMP.length)))];
          }

          if (!ch) ch = "*";

          // Final shaded RGB with soft specular lift on sunlit petals
          const shade = 0.42 + lum * 0.72;
          const highlight = part === PART.PETAL && lum > 0.84 ? (lum - 0.84) * 145 : 0;

          charBuf[cellIdx] = ch;
          rBuf[cellIdx] = Math.min(255, Math.round(baseR * shade + highlight));
          gBuf[cellIdx] = Math.min(255, Math.round(baseG * shade + highlight));
          bBuf[cellIdx] = Math.min(255, Math.round(baseB * shade + highlight));
          aBuf[cellIdx] = Math.max(0.45, Math.min(1.0, 0.56 + depthFactor * 0.42));
        }

        // Clear frame and draw subtle soft shadow ellipse beneath the bouquet stems
        bCtx.clearRect(0, 0, canvasW, canvasH);

        const shadowGrad = bCtx.createRadialGradient(
          cx, canvasH * 0.90, 4,
          cx, canvasH * 0.90, fitSize * 0.28
        );
        shadowGrad.addColorStop(0, "rgba(10, 6, 14, 0.46)");
        shadowGrad.addColorStop(1, "rgba(10, 6, 14, 0)");
        bCtx.fillStyle = shadowGrad;
        bCtx.beginPath();
        bCtx.ellipse(cx, canvasH * 0.90, fitSize * 0.28, fitSize * 0.06, 0, 0, Math.PI * 2);
        bCtx.fill();

        // Draw crisp ASCII cells onto the canvas
        const halfW = cellW * 0.5;
        const halfH = cellH * 0.5;
        for (let row = 0; row < rows; row++) {
          const py = row * cellH + halfH;
          const rowOffset = row * cols;
          for (let col = 0; col < cols; col++) {
            const idx = rowOffset + col;
            if (zBuf[idx] === -1e9 || !charBuf[idx]) continue;

            bCtx.fillStyle = `rgba(${rBuf[idx]},${gBuf[idx]},${bBuf[idx]},${aBuf[idx].toFixed(2)})`;
            bCtx.fillText(charBuf[idx], col * cellW + halfW, py);
          }
        }
      }

      /* =====================================================================
       * 5. SUBTLE AMBIENT FLOATING PARTICLES (BACKGROUND)
       * ===================================================================== */
      const ambientCanvas = document.getElementById("ambientCanvas");
      const aCtx = ambientCanvas.getContext("2d");
      const motes = [];

      function initAmbientMotes() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        const adpr = Math.min(window.devicePixelRatio || 1, 2);
        ambientCanvas.width = Math.round(w * adpr);
        ambientCanvas.height = Math.round(h * adpr);
        aCtx.setTransform(adpr, 0, 0, adpr, 0, 0);

        const desired = w < 640 ? 18 : 30;
        motes.length = 0;
        const tints = [
          "rgba(232, 168, 188, 0.34)",
          "rgba(208, 184, 238, 0.32)",
          "rgba(246, 210, 178, 0.32)",
          "rgba(255, 255, 255, 0.45)",
        ];
        for (let i = 0; i < desired; i++) {
          motes.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: 1.5 + Math.random() * 2.8,
            vx: (Math.random() - 0.5) * 8,
            vy: -(6 + Math.random() * 12),
            phase: Math.random() * Math.PI * 2,
            color: tints[i % tints.length],
          });
        }
      }

      function renderAmbient(dt) {
        const w = window.innerWidth;
        const h = window.innerHeight;
        aCtx.clearRect(0, 0, w, h);

        for (let i = 0; i < motes.length; i++) {
          const m = motes[i];
          if (!prefersReducedMotion) {
            m.phase += dt * 0.9;
            m.x += (m.vx + Math.sin(m.phase) * 7) * dt;
            m.y += m.vy * dt;
            if (m.y < -10) {
              m.y = h + 10;
              m.x = Math.random() * w;
            }
            if (m.x < -10) m.x = w + 10;
            if (m.x > w + 10) m.x = -10;
          }
          aCtx.fillStyle = m.color;
          aCtx.beginPath();
          aCtx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
          aCtx.fill();
        }
      }

      /* =====================================================================
       * 6. INTERACTIVE COLOR CONTROLS & UI WIRING
       * ===================================================================== */
      const paletteListEl = document.getElementById("paletteList");
      const swatchStripEl = document.getElementById("swatchStrip");
      const cycleBtn = document.getElementById("cycleBtn");
      const randomBtn = document.getElementById("randomBtn");
      const resetBtn = document.getElementById("resetBtn");
      const pauseBtn = document.getElementById("pauseBtn");
      const pauseIcon = document.getElementById("pauseIcon");
      const pauseText = document.getElementById("pauseText");

      const swatchInputs = [];
      const swatchLabels = [];

      function updatePauseUI() {
        pauseBtn.setAttribute("aria-pressed", String(isPaused));
        pauseIcon.textContent = isPaused ? "▶" : "❚❚";
        pauseText.textContent = isPaused ? "Play" : "Pause";
      }

      function setTargetColors(flowerHexList, ribbonHex, paletteId = null) {
        for (let i = 0; i < 7; i++) {
          const rgb = hexToRgb(flowerHexList[i]);
          targetFlowersRgb[i][0] = rgb[0];
          targetFlowersRgb[i][1] = rgb[1];
          targetFlowersRgb[i][2] = rgb[2];

          if (swatchInputs[i]) {
            swatchInputs[i].value = flowerHexList[i];
            swatchLabels[i].style.background = flowerHexList[i];
          }
        }

        if (ribbonHex) {
          const rRgb = hexToRgb(ribbonHex);
          targetRibbonRgb[0] = rRgb[0];
          targetRibbonRgb[1] = rRgb[1];
          targetRibbonRgb[2] = rRgb[2];
        }

        currentPaletteId = paletteId;
        const buttons = paletteListEl.querySelectorAll(".palette-btn");
        buttons.forEach((btn) => {
          btn.classList.toggle("is-active", btn.dataset.paletteId === currentPaletteId);
        });
      }

      function applyPaletteByIndex(idx) {
        currentPaletteIdx = ((idx % COLOR_PALETTES.length) + COLOR_PALETTES.length) % COLOR_PALETTES.length;
        const p = COLOR_PALETTES[currentPaletteIdx];
        setTargetColors(p.flowers, p.ribbon, p.id);
      }

      function buildColorUI() {
        // Preset palette buttons
        COLOR_PALETTES.forEach((palette, index) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "palette-btn" + (index === 0 ? " is-active" : "");
          btn.dataset.paletteId = palette.id;

          const dots = document.createElement("span");
          dots.className = "palette-dots";
          palette.flowers.slice(0, 3).forEach((hex) => {
            const dot = document.createElement("span");
            dot.style.background = hex;
            dots.appendChild(dot);
          });

          const text = document.createElement("span");
          text.textContent = palette.name;

          btn.appendChild(dots);
          btn.appendChild(text);
          btn.addEventListener("click", () => applyPaletteByIndex(index));
          paletteListEl.appendChild(btn);
        });

        // 7 individual flower color pickers
        const lilyNames = [
          "Center Lily",
          "Front-Left Lily",
          "Front-Right Lily",
          "Left Lily",
          "Right Lily",
          "Back-Left Lily",
          "Back-Right Lily",
        ];

        for (let i = 0; i < 7; i++) {
          const initialHex = COLOR_PALETTES[0].flowers[i];
          const label = document.createElement("label");
          label.className = "lily-swatch";
          label.style.background = initialHex;
          label.title = `Customize ${lilyNames[i]}`;

          const num = document.createElement("span");
          num.textContent = String(i + 1);

          const input = document.createElement("input");
          input.type = "color";
          input.value = initialHex;
          input.setAttribute("aria-label", `Color for ${lilyNames[i]}`);

          input.addEventListener("input", () => {
            const rgb = hexToRgb(input.value);
            targetFlowersRgb[i][0] = rgb[0];
            targetFlowersRgb[i][1] = rgb[1];
            targetFlowersRgb[i][2] = rgb[2];
            label.style.background = input.value;
            // Clear preset highlight when custom-edited
            currentPaletteId = null;
            paletteListEl.querySelectorAll(".palette-btn").forEach((b) => b.classList.remove("is-active"));
          });

          label.appendChild(num);
          label.appendChild(input);
          swatchStripEl.appendChild(label);

          swatchInputs.push(input);
          swatchLabels.push(label);
        }
      }

      // Curated floral randomizer (always soft, luminous, romantic tones)
      function randomizeBouquetColors() {
        const baseHue = Math.random() * 360;
        const spread = 24 + Math.random() * 68;
        const flowers = [];

        for (let i = 0; i < 7; i++) {
          const hue = (baseHue + (i - 3) * (spread / 3) + (Math.random() - 0.5) * 18 + 360) % 360;
          const sat = 52 + Math.random() * 34;
          const light = 68 + Math.random() * 20;
          flowers.push(hslToHex(hue, sat, light));
        }

        const ribbon = hslToHex((baseHue + 18) % 360, 44, 76);
        setTargetColors(flowers, ribbon, null);
      }

      cycleBtn.addEventListener("click", () => applyPaletteByIndex(currentPaletteIdx + 1));
      randomBtn.addEventListener("click", randomizeBouquetColors);
      resetBtn.addEventListener("click", () => applyPaletteByIndex(0));

      pauseBtn.addEventListener("click", () => {
        isPaused = !isPaused;
        updatePauseUI();
      });

      /* Dark / Light Theme Toggle */
      const themeToggleBtn = document.getElementById("themeToggleBtn");
      const themeIcon = document.getElementById("themeIcon");
      const themeText = document.getElementById("themeText");

      function getPreferredTheme() {
        try {
          const saved = localStorage.getItem("bouquet_theme");
          if (saved === "dark" || saved === "light") return saved;
        } catch (_) {}
        return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }

      function applyTheme(theme) {
        if (theme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
          themeIcon.textContent = "☀️";
          themeText.textContent = "Light";
          themeToggleBtn.setAttribute("aria-pressed", "true");
        } else {
          document.documentElement.removeAttribute("data-theme");
          themeIcon.textContent = "🌙";
          themeText.textContent = "Dark";
          themeToggleBtn.setAttribute("aria-pressed", "false");
        }
      }

      let currentTheme = getPreferredTheme();
      applyTheme(currentTheme);

      themeToggleBtn.addEventListener("click", () => {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        try {
          localStorage.setItem("bouquet_theme", currentTheme);
        } catch (_) {}
        applyTheme(currentTheme);
      });

      if (window.matchMedia) {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", (e) => {
          let hasSaved = false;
          try {
            hasSaved = Boolean(localStorage.getItem("bouquet_theme"));
          } catch (_) {}
          if (!hasSaved) {
            currentTheme = e.matches ? "dark" : "light";
            applyTheme(currentTheme);
          }
        });
      }

      /* =====================================================================
       * 7. BIRTHDAY LETTER GENTLE TYPING ANIMATION
       * ===================================================================== */
      const letterHeadingEl = document.getElementById("letterHeading");
      const letterBodyEl = document.getElementById("letterBody");
      const letterCardEl = document.getElementById("letterCard");
      const skipTypingBtn = document.getElementById("skipTypingBtn");
      const replayTypingBtn = document.getElementById("replayTypingBtn");

      letterHeadingEl.textContent = LETTER_CONFIG.heading;

      let typingTimerId = null;
      let typingStarted = false;
      let typingIndex = 0;

      const textNode = document.createTextNode("");
      const cursorEl = document.createElement("span");
      cursorEl.className = "typing-cursor";
      cursorEl.setAttribute("aria-hidden", "true");
      letterBodyEl.appendChild(textNode);
      letterBodyEl.appendChild(cursorEl);

      function finishLetterImmediately() {
        if (typingTimerId !== null) {
          clearTimeout(typingTimerId);
          typingTimerId = null;
        }
        typingIndex = LETTER_CONFIG.message.length;
        textNode.nodeValue = LETTER_CONFIG.message;
        cursorEl.classList.add("is-done");
        skipTypingBtn.style.display = "none";
      }

      function stepTyping() {
        if (typingIndex >= LETTER_CONFIG.message.length) {
          finishLetterImmediately();
          return;
        }
        const ch = LETTER_CONFIG.message[typingIndex];
        typingIndex += 1;
        textNode.nodeValue = LETTER_CONFIG.message.slice(0, typingIndex);

        // Gentle natural cadence on punctuation and paragraph breaks
        let delay = LETTER_CONFIG.typingDelayMs;
        if (ch === "\n") delay = 140;
        else if (ch === "." || ch === "!" || ch === "?") delay = 175;
        else if (ch === ",") delay = 85;

        typingTimerId = setTimeout(stepTyping, delay);
      }

      function startTypingAnimation() {
        if (typingTimerId !== null) {
          clearTimeout(typingTimerId);
          typingTimerId = null;
        }
        typingStarted = true;
        if (prefersReducedMotion) {
          finishLetterImmediately();
          return;
        }
        typingIndex = 0;
        textNode.nodeValue = "";
        cursorEl.classList.remove("is-done");
        skipTypingBtn.style.display = "inline-block";
        stepTyping();
      }

      skipTypingBtn.addEventListener("click", finishLetterImmediately);
      replayTypingBtn.addEventListener("click", startTypingAnimation);

      /* =====================================================================
       * INTRO ENVELOPE OPENING & MAIN SITE REVEAL
       * ===================================================================== */
      const introScreen = document.getElementById("introScreen");
      const introEnvelope = document.getElementById("introEnvelope");
      const introWaxSeal = document.getElementById("introWaxSeal");
      const openMeBtn = document.getElementById("openMeBtn");
      const reopenEnvelopeBtn = document.getElementById("reopenEnvelopeBtn");
      const pageShell = document.querySelector(".page-shell");

      let isOpening = false;
      let hasRevealedMain = false;

      // Lock body scroll while intro screen is active to prevent accidental swiping on mobile
      document.body.style.overflow = "hidden";

      function openEnvelope() {
        if (isOpening || hasRevealedMain) return;
        isOpening = true;

        // Step 1: Flap unfolds backwards in 3D, wax seal breaks
        introEnvelope.classList.add("is-opening");
        introEnvelope.setAttribute("aria-expanded", "true");

        // Step 2: Letter card slowly slides upward out of the pocket
        setTimeout(() => {
          introEnvelope.classList.add("is-sliding");
        }, 400);

        // Step 3: Paper unfurls and expands gently
        setTimeout(() => {
          introEnvelope.classList.add("is-unfolding");
        }, 850);

        // Step 4: Gentle, magical transition revealing the bouquet and letter
        setTimeout(() => {
          hasRevealedMain = true;
          introScreen.classList.add("is-revealed");
          pageShell.classList.add("is-visible");

          // Restore normal page scrolling on mobile
          document.body.style.overflow = "";
          window.scrollTo({ top: 0, behavior: "instant" });

          // Start typing the personal letter beneath the bouquet
          setTimeout(() => {
            if (!typingStarted) {
              startTypingAnimation();
            }
          }, 450);
        }, 1450);

        // Step 5: Cleanly hide intro screen after transition completes
        setTimeout(() => {
          introScreen.style.display = "none";
        }, 2400);
      }

      function reopenEnvelope(e) {
        if (e) {
          e.stopPropagation();
          e.preventDefault();
        }
        if (!hasRevealedMain) return;

        // Reset typewriter animation
        if (typingTimerId !== null) {
          clearTimeout(typingTimerId);
          typingTimerId = null;
        }
        typingStarted = false;
        typingIndex = 0;
        textNode.nodeValue = "";
        cursorEl.classList.remove("is-done");

        // Scroll back to top and lock scroll for intro
        window.scrollTo({ top: 0, behavior: "instant" });
        document.body.style.overflow = "hidden";

        introScreen.style.display = "flex";
        void introScreen.offsetWidth;

        introScreen.classList.remove("is-revealed");
        pageShell.classList.remove("is-visible");

        setTimeout(() => {
          introEnvelope.classList.remove("is-unfolding", "is-sliding", "is-opening");
          introEnvelope.setAttribute("aria-expanded", "false");
          isOpening = false;
          hasRevealedMain = false;
        }, 350);
      }

      function addTriggerListener(el) {
        if (!el) return;
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          openEnvelope();
        });
      }

      addTriggerListener(introEnvelope);
      addTriggerListener(openMeBtn);
      addTriggerListener(introWaxSeal);

      introEnvelope.addEventListener("keydown", (e) => {
        if (!isOpening && !hasRevealedMain && (e.key === "Enter" || e.key === " ")) {
          e.preventDefault();
          openEnvelope();
        }
      });

      if (reopenEnvelopeBtn) {
        reopenEnvelopeBtn.addEventListener("click", reopenEnvelope);
      }

      /* =====================================================================
       * 8. MAIN ANIMATION LOOP & RESIZE HANDLING
       * ===================================================================== */
      let rafId = null;
      let lastTimestamp = 0;

      function animate(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        const dt = Math.min(0.05, Math.max(0.001, (timestamp - lastTimestamp) / 1000));
        lastTimestamp = timestamp;

        renderBouquet(dt);
        renderAmbient(dt);

        rafId = requestAnimationFrame(animate);
      }

      function startLoop() {
        if (rafId === null) {
          lastTimestamp = 0;
          rafId = requestAnimationFrame(animate);
        }
      }

      function stopLoop() {
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      // Pause frame loop when tab is hidden to save battery and prevent dt spikes
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          stopLoop();
        } else {
          startLoop();
        }
      });

      // Debounced resize handling for desktop and mobile orientation changes
      let resizeTimeout = null;
      function handleResize() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          configureGrid();
          initAmbientMotes();
        }, 80);
      }

      window.addEventListener("resize", handleResize);
      if ("ResizeObserver" in window) {
        const ro = new ResizeObserver(handleResize);
        ro.observe(stageFrame);
      }

      // Initialize everything cleanly
      buildColorUI();
      updatePauseUI();
      configureGrid();
      initAmbientMotes();
      startLoop();
    })();
  </script>
</body>
</html>
